<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />

    <!-- Meta Tags PWA -->
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./spotify.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <title>Spotify-Clone</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="./" aria-label="Spotify início">
          <img src="./spotify.png" alt="Spotify" class="brand-mark" /> Spotify
        </a>
        <nav aria-label="Navegação principal">
          <a class="nav-item active" href="#" id="btn-inicio"
            ><span>⌂</span> Início</a
          >

          <div class="sidebar-queue-header">NA FILA</div>
          <div id="lista-fila" class="lista-fila">
            <span class="empty-queue">A fila está vazia</span>
          </div>
        </nav>
        <div class="sidebar-note">A sua trilha sonora começa aqui.</div>
      </aside>

      <main class="content" id="inicio">
        <header class="topbar">
          <div class="search-wrap">
            <span aria-hidden="true">⌕</span>
            <input
              type="search"
              id="pesquisa"
              placeholder="O que quer ouvir?"
              aria-label="Procurar músicas ou artistas"
            />
          </div>
          <div class="genre-wrap">
            <select id="filtro-genero" aria-label="Filtrar por género">
              <option value="">Todos os géneros</option>
            </select>
          </div>
          <button class="admin-button" id="adm" type="button">
            Espaço ADM
          </button>
        </header>

        <div class="section-heading" style="margin-top: 30px">
          <div>
            <p class="eyebrow">EXPLORE</p>
            <h2>Músicas</h2>
          </div>
          <span id="song-count" class="song-count">0 faixas</span>
        </div>

        <div id="music-grid" class="music-grid"></div>
      </main>
    </div>

    <footer class="player" id="player">
      <div class="now-playing">
        <img id="now-cover" alt="" hidden />
        <div>
          <strong id="now-title">Escolha uma música</strong>
          <span id="now-artist">A sua próxima faixa favorita está aqui</span>
        </div>
      </div>

      <div class="player-controls">
        <button
          id="play-toggle"
          class="play-toggle"
          type="button"
          aria-label="Reproduzir"
          disabled
        >
          ▶
        </button>
        <div class="timeline">
          <span id="current-time">0:00</span>
          <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            aria-label="Posição da música"
          />
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="volume-wrap">
        <span aria-hidden="true">♫</span>
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.8"
          aria-label="Volume"
        />
      </div>

      <audio id="audio"></audio>
    </footer>

    <!-- Ficheiros JS Externos -->
    <script src="./acesso-admin.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
